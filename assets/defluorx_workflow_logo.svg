<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" font-family="Montserrat, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gTeal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#17bd8c"/><stop offset="1" stop-color="#0c7d5d"/></linearGradient>
    <linearGradient id="gBlue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4aa3d4"/><stop offset="1" stop-color="#2b6f9e"/></linearGradient>
    <linearGradient id="gAmber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2b431"/><stop offset="1" stop-color="#d68a00"/></linearGradient>
    <linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff6a3d"/><stop offset="1" stop-color="#d81f16"/></linearGradient>
    <linearGradient id="gRibbon" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0c7d5d"/><stop offset="0.5" stop-color="#b9760a"/><stop offset="1" stop-color="#c21d15"/></linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#123" flood-opacity="0.18"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9fb0ad"/>
    </marker>
  </defs>

  <!-- solid white plate so the mark stays legible on any README theme (light/dark) -->
  <rect x="0" y="0" width="1280" height="600" rx="22" fill="#ffffff"/>
  <rect x="3" y="3" width="1274" height="594" rx="20" fill="none" stroke="#e3ede9" stroke-width="2"/>

  <!-- ===== header ===== -->
  <text x="640" y="68" font-size="35" font-weight="800" fill="#1f2937" text-anchor="middle" letter-spacing="0.2"><tspan fill="#0c7d5d">DeFluorX:</tspan> Discovering <tspan fill="#0c7d5d">FAcDs</tspan> for PFAS Defluorination</text>
  <text x="640" y="104" font-size="18" font-weight="600" fill="#15b587" text-anchor="middle" letter-spacing="2.6">FULLY  AUTOMATED  END-TO-END  ENZYME-DISCOVERY  PIPELINE</text>
  <line x1="220" y1="126" x2="1060" y2="126" stroke="#dfe9e5" stroke-width="2"/>

  <!-- ===== scale equation: the search space that is actually enumerated ===== -->
  <g font-size="15.5" font-weight="700" text-anchor="middle">
    <rect x="298" y="149" width="264" height="34" rx="17" fill="#e9f7f1" stroke="#bfe6d7" stroke-width="1.5"/>
    <text x="430" y="171" fill="#0c7d5d"><tspan font-weight="800">2,150</tspan> bacterial FAcD variants</text>
    <text x="580" y="172" fill="#6b7c78" font-size="19">×</text>
    <rect x="598" y="149" width="104" height="34" rx="17" fill="#eaf3fa" stroke="#c6dcec" stroke-width="1.5"/>
    <text x="650" y="171" fill="#2b6f9e"><tspan font-weight="800">27</tspan> PFAS</text>
    <text x="720" y="172" fill="#6b7c78" font-size="19">=</text>
    <rect x="738" y="149" width="244" height="34" rx="17" fill="#fdeeea" stroke="#f4cabc" stroke-width="1.5"/>
    <text x="860" y="171" fill="#c21d15"><tspan font-weight="800">58,050</tspan> predicted complexes</text>
  </g>

  <!-- ===== connectors (behind medallions) ===== -->
  <g stroke="#c3d3cf" stroke-width="5" fill="none">
    <line x1="256" y1="322" x2="356" y2="322" marker-end="url(#arrow)"/>
    <line x1="556" y1="322" x2="656" y2="322" marker-end="url(#arrow)"/>
    <line x1="856" y1="322" x2="956" y2="322" marker-end="url(#arrow)"/>
  </g>

  <!-- ============ PHASE 1 - PREDICT ============ -->
  <g filter="url(#ds)">
    <circle cx="180" cy="322" r="64" fill="url(#gTeal)"/>
    <path d="M152 354 C144 330 173 330 167 308 C162 292 181 291 185 308 C189 325 205 321 202 343"
          fill="none" stroke="#bff0df" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
    <path d="M160 350 C152 326 181 326 175 304 C170 288 189 287 193 304 C197 321 213 317 210 339"
          fill="none" stroke="#dff8ee" stroke-width="6" stroke-linecap="round" opacity="0.75"/>
    <path d="M168 346 C160 322 189 322 183 300 C178 284 197 283 201 300 C205 317 221 313 218 335"
          fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <circle cx="205" cy="325" r="7.5" fill="#bff0df"/>
  </g>
  <text x="180" y="410" font-size="20" font-weight="700" fill="#0c7d5d" text-anchor="middle">1 · Predict</text>
  <text x="180" y="431" font-size="12.5" font-weight="500" fill="#5a6b67" text-anchor="middle">Boltz-2 · MSA + 5-model diffusion</text>
  <text x="180" y="448" font-size="12.5" font-weight="500" fill="#5a6b67" text-anchor="middle">pTM / ipTM · best complex per pair</text>

  <!-- ============ PHASE 2 - SCREEN & TIER ============ -->
  <g filter="url(#ds)">
    <circle cx="480" cy="322" r="64" fill="url(#gBlue)"/>
    <rect x="442" y="292" width="76" height="11" rx="4" fill="#fff"/>
    <rect x="451" y="310" width="58" height="11" rx="4" fill="#fff" opacity="0.85"/>
    <rect x="460" y="328" width="40" height="11" rx="4" fill="#fff" opacity="0.7"/>
    <rect x="469" y="346" width="22" height="11" rx="4" fill="#fdd" opacity="0.95"/>
  </g>
  <text x="480" y="410" font-size="20" font-weight="700" fill="#2b6f9e" text-anchor="middle">2 · Screen &amp; Tier</text>
  <text x="480" y="431" font-size="12.5" font-weight="500" fill="#5a6b67" text-anchor="middle">competence-floor tiers · SN2 geometry</text>
  <text x="480" y="448" font-size="12.5" font-weight="500" fill="#5a6b67" text-anchor="middle">Pareto fronts · publication figure suite · phylogeny</text>

  <!-- ============ PHASE 3 - SIMULATE ============ -->
  <g filter="url(#ds)">
    <circle cx="780" cy="322" r="64" fill="url(#gAmber)"/>
    <path d="M744 330 q 12 -32 24 0 t 24 0 t 24 0" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
    <line x1="744" y1="352" x2="816" y2="352" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>
  <text x="780" y="410" font-size="20" font-weight="700" fill="#b9760a" text-anchor="middle">3 · Simulate</text>
  <text x="780" y="431" font-size="12.5" font-weight="500" fill="#5a6b67" text-anchor="middle">Desmond MD · 1 µs · SID · Prime MM-GBSA</text>
  <text x="780" y="448" font-size="12.5" font-weight="500" fill="#5a6b67" text-anchor="middle">WaterMap hydration · NAC dwell time</text>

  <!-- ============ PHASE 4 - DEFLUORINATE ============ -->
  <g filter="url(#ds)">
    <circle cx="1080" cy="322" r="64" fill="url(#gRed)"/>
    <circle cx="1080" cy="328" r="14" fill="#3a1512"/>
    <text x="1080" y="333" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">C</text>
    <path d="M1038 328 L1062 328" stroke="#fff" stroke-width="4" stroke-dasharray="5 4" stroke-linecap="round"/>
    <circle cx="1032" cy="328" r="7.5" fill="#fff"/>
    <line x1="1090" y1="316" x2="1104" y2="296" stroke="#fff" stroke-width="4" stroke-dasharray="4 4" stroke-linecap="round"/>
  </g>
  <text x="1080" y="410" font-size="20" font-weight="700" fill="#c21d15" text-anchor="middle">4 · Defluorinate</text>
  <text x="1080" y="431" font-size="12.5" font-weight="500" fill="#5a6b67" text-anchor="middle">B3LYP QM/MM relaxed scan · ΔE‡ barrier</text>
  <text x="1080" y="448" font-size="12.5" font-weight="500" fill="#5a6b67" text-anchor="middle">Mulliken F⁻ charge · defluorination landscape</text>

  <!-- ===== the payoff: fluoride leaving ===== -->
  <g filter="url(#ds)">
    <circle cx="1176" cy="252" r="24" fill="url(#gRed)"/>
    <circle cx="1176" cy="252" r="24" fill="none" stroke="#fff" stroke-width="1.5" opacity="0.6"/>
    <text x="1176" y="259" font-size="20" font-weight="800" fill="#fff" text-anchor="middle">F⁻</text>
  </g>
  <path d="M1148 228 q 11 -11 4 -24" fill="none" stroke="#ff6a3d" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <path d="M1200 230 q 11 -6 20 -13" fill="none" stroke="#ff6a3d" stroke-width="3" stroke-linecap="round" opacity="0.6"/>

  <!-- ===== payoff ribbon: what the pipeline delivers ===== -->
  <rect x="40" y="486" width="1200" height="46" rx="13" fill="#f2f9f6" stroke="#d6ece3" stroke-width="1.5"/>
  <rect x="40" y="486" width="6" height="46" rx="3" fill="url(#gRibbon)"/>
  <text x="640" y="515" font-size="15.5" font-weight="600" fill="#3c4a47" text-anchor="middle" letter-spacing="0.3">58,050 complexes  →  competence-tiered leads  →  µs MD + MM-GBSA + WaterMap  →  <tspan font-weight="800" fill="#c21d15">quantum-mechanical proof of C-F bond cleavage &amp; F⁻ release</tspan></text>

  <!-- ===== footer: the engineering weight behind it ===== -->
  <text x="640" y="562" font-size="12.5" font-weight="600" fill="#8a9793" text-anchor="middle" letter-spacing="0.6">7-STEP AUTOMATED PIPELINE   ·   42,784 LINES   ·   BOLTZ-2 → DESMOND MD → B3LYP QM/MM   ·   CFG SINGLE SOURCE OF TRUTH   ·   FULLY REPRODUCIBLE</text>
</svg>
